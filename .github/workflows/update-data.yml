name: FPL-data bijwerken

on:
  schedule:
    # elke 3 uur kijken of er een nieuwe gameweek is afgerond; zo niet, dan gebeurt er niets
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ook bijwerken als de gameweek niet is veranderd"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data ophalen en naar Supabase sturen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force }}
        run: python3 scripts/update_data.py
      - name: Committen als er iets is veranderd
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "fpl-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "FPL-data bijgewerkt"
            git push
          else
            echo "Geen wijzigingen"
          fi
