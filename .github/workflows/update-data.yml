name: FPL-data bijwerken

on:
  schedule:
    - cron: "17 */3 * * *"   # elke 3 uur
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data ophalen
        run: python3 scripts/update_data.py
      - name: Committen als er iets is veranderd
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "fpl-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "FPL-data bijgewerkt"
            git push
          else
            echo "Geen wijzigingen"
          fi
