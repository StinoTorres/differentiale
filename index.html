<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Differentiale</title>
<meta name="description" content="Raad elke dag de geheime FPL-asset in zes pogingen. Met klassement en poules voor je vrienden.">
<meta property="og:title" content="Differentiale">
<meta property="og:description" content="Raad elke dag de geheime FPL-asset in zes pogingen.">
<meta name="theme-color" content="#37003c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Differentiale">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#37003c; --purple2:#4b0a54; --pink:#e90052; --cyan:#04f5ff; --green:#00ff85;
  --bg:#f3f0f5; --bg2:#ece6ef; --card:#ffffff; --card2:#ffffff; --line:#e4dbe8;
  --ink:#37003c; --mute:#76647a; --faint:#a495a8;
  --acc:#00ff85; --acc-ink:#37003c; --link:#e90052;
  --exact:#00ff85; --close:#ffd23f; --miss:#ece5ef;
  --bad:#e90052; --r:14px;
  --grad:linear-gradient(90deg,#04f5ff 0%,#00ff85 100%);
  --surface:#fff; --tile-ink:#37003c; --hd:#37003c; --okbg:#eafff4; --hover:#f5efff; --body:#4a2a4f;
  --banner-bg:#e6fdff; --banner-bd:#9ef3f8; --banner-ink:#37003c; --sh:rgba(55,0,60,.07); --seg-on:#37003c; --seg-on-ink:#fff;
}
[data-theme=dark]{
  --bg:#1a001e; --bg2:#260029; --card:#2b0030; --card2:#2b0030; --line:#4a0f52;
  --ink:#f6eef8; --mute:#b9a2c1; --faint:#82688c; --link:#04f5ff;
  --miss:#44084d; --close:#ffd23f; --link:#04f5ff;
  --surface:#2b0030; --tile-ink:#f6eef8; --hd:#00ff85; --okbg:#003a2a; --hover:#3a0a42; --body:#dccfe0;
  --banner-bg:#06343a; --banner-bd:#0b6f78; --banner-ink:#b9fbff; --sh:rgba(0,0,0,.35); --seg-on:#00ff85; --seg-on-ink:#37003c;
}
html{transition:background .3s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* top band */
.top{position:relative;overflow:hidden;background:
  radial-gradient(420px 220px at 105% -10%, rgba(4,245,255,.55), transparent 60%),
  radial-gradient(380px 240px at -15% 120%, rgba(233,0,82,.55), transparent 60%),
  linear-gradient(135deg,#37003c 0%,#4f0d5a 55%,#2a0030 100%);
  color:#fff;padding:18px 0 16px;border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(55,0,60,.25)}
[data-theme=dark] .top{background:radial-gradient(420px 220px at 105% -10%, rgba(0,255,133,.22), transparent 60%),radial-gradient(380px 240px at -15% 120%, rgba(233,0,82,.4), transparent 60%),linear-gradient(135deg,#1a001e 0%,#37003c 60%,#14001a 100%)}
.top::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.wrap{max-width:540px;margin:0 auto;padding:16px 14px 80px}
.top .inner{max-width:540px;margin:0 auto;padding:0 14px;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand .t1{font-weight:800;font-size:25px;letter-spacing:-.02em}
.brand .t1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .t2{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:4px;font-weight:500}
.helpbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-weight:800;flex:none}
.helpbtn:hover{background:rgba(255,255,255,.24)}
.hright{display:flex;align-items:center;gap:6px;flex:none}
.mascot{width:112px;height:112px;margin:-22px -12px -22px -4px;position:relative;flex:none;border-radius:50%;transition:transform .25s}
.mascot:hover{transform:scale(1.05) rotate(-3deg)}
.mascot:active{transform:scale(.94)}
.mascot svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .35s, transform .45s}
.mascot .night{opacity:0;transform:scale(.6) rotate(20deg)}
[data-theme=dark] .mascot .day{opacity:0;transform:scale(.6) rotate(-20deg)}
[data-theme=dark] .mascot .night{opacity:1;transform:none}
.mascot .lbl{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.35);color:#fff;padding:2px 7px;border-radius:999px;white-space:nowrap}

nav{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.12);border-radius:999px;padding:4px}
nav button{padding:10px 0;border-radius:999px;font-weight:700;font-size:14px;color:rgba(255,255,255,.8)}
nav button.on{background:#fff;color:var(--purple)}

.banner{background:var(--banner-bg);border:1px solid var(--banner-bd);color:var(--banner-ink);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{font-weight:800;text-decoration:underline;color:inherit}
.note{color:var(--mute);font-size:13px;line-height:1.45}

/* search */
.searchbox{position:relative;margin-bottom:14px}
.searchbox input{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:14px 16px 14px 46px;font-size:16px;font-weight:600;outline:none;box-shadow:0 4px 14px rgba(55,0,60,.06)}
.searchbox input::placeholder{color:var(--faint);font-weight:500}
.searchbox input:focus{border-color:var(--hd)}
.searchbox svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--hd)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border-radius:var(--r);overflow:hidden;z-index:20;box-shadow:0 18px 40px rgba(55,0,60,.22)}
.sugg button{display:flex;width:100%;text-align:left;padding:11px 14px;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.hi{background:var(--hover)}
.sugg .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .nm small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sugg .meta{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap;font-weight:600}

.meter{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:4px 2px 12px;font-weight:600}
.pips{display:flex;gap:5px}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.pips i.used{background:var(--hd)}
.pips i.win{background:var(--green)}

/* grid */
.board{background:var(--surface);border-radius:18px;padding:14px 12px 6px;box-shadow:0 6px 20px var(--sh);margin-bottom:12px}
.colhead,.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.colhead{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:center;margin-bottom:8px}
.guess{margin-bottom:12px}
.guess .gname{font-weight:800;font-size:14px;margin:0 2px 6px;display:flex;justify-content:space-between}
.guess .gname span{color:var(--hd);font-weight:800;font-size:12px}
.tile{position:relative;height:54px;border-radius:10px;background:var(--miss);color:var(--tile-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1.05;overflow:hidden}
.tile{--final:var(--miss)} .tile.exact{--final:var(--exact)} .tile.close{--final:var(--close)}
.tile.anim{animation:wflip .55s ease-in-out both;animation-delay:calc(var(--i,0) * .32s)}
.tile.anim > *{animation:wshow .55s step-end both;animation-delay:calc(var(--i,0) * .32s)}
@keyframes wflip{0%{transform:rotateX(0);background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
  50%{transform:rotateX(90deg);background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
  50.01%{transform:rotateX(90deg);background:var(--final);box-shadow:none}
  100%{transform:rotateX(0);background:var(--final);box-shadow:none}}
@keyframes wshow{0%{opacity:0}50%{opacity:1}}
.tile.exact{background:var(--exact);color:#37003c}
.tile.close{background:var(--close);color:#37003c}
.tile .ar{font-size:11px;font-weight:900;margin-top:3px;opacity:.8}
.tile .club{font-size:14px;letter-spacing:.02em}
.tile .stripe{position:absolute;left:0;right:0;bottom:0;height:5px}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.empty .tile{animation:none;background:transparent;border:2px dashed var(--line)}

.legend{display:flex;gap:12px;justify-content:center;font-size:11.5px;color:var(--mute);margin:10px 0 16px;flex-wrap:wrap;font-weight:600}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* panels */
.panel{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px var(--sh)}
.panel h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--hd);margin-bottom:10px;font-weight:800}
.know{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.know dt{color:var(--mute);font-weight:500}
.know dd{font-weight:800}
.hints{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{border:2px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;text-align:left;min-height:62px;background:var(--surface);font-weight:500}
.hint b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px;font-weight:800}
.hint:not(:disabled):not(.open){border-color:var(--hd)}
.hint:disabled{opacity:.6;cursor:default}
.hint.wide{grid-column:span 2}
.hint.open{border-color:var(--green);background:var(--okbg)}
.hint.open b{color:var(--hd)}

/* result */
.result{text-align:center;padding:22px 16px;color:#fff;background:
  radial-gradient(300px 160px at 100% 0%, rgba(4,245,255,.45), transparent 60%),
  radial-gradient(300px 180px at 0% 100%, rgba(233,0,82,.45), transparent 60%),
  linear-gradient(135deg,#37003c,#521060)}
.result .big{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.result .big small{font-size:16px;font-weight:700;letter-spacing:0;-webkit-text-fill-color:rgba(255,255,255,.7)}
.result .ans{font-size:21px;font-weight:800;margin:10px 0 2px}
.result .sub{color:rgba(255,255,255,.75);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.result .stats div{background:rgba(255,255,255,.1)}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:11px;color:var(--mute);font-weight:600}
.result .stats span{color:rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 18px;font-weight:800;font-size:14px;background:var(--grad);color:var(--purple)}
.btn.ghost{background:transparent;border:2px solid var(--hd);color:var(--hd)}
.result .btn.ghost{border-color:rgba(255,255,255,.6);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.count{margin-top:14px;font-size:12px;color:rgba(255,255,255,.7);font-weight:600}

/* board */
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:0 4px 14px var(--sh)}
.seg button{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--seg-on);color:var(--seg-on-ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);text-align:left;padding:8px 8px;font-weight:800}
td{padding:12px 8px;border-top:1px solid var(--line);font-weight:600}
td.r,th.r{text-align:right}
td.pos{width:36px;color:var(--hd);font-weight:800}
tr.me td{background:var(--okbg)}
tr.me td:first-child{box-shadow:inset 4px 0 0 var(--green)}
.tag{color:var(--faint);font-weight:500;font-size:12px;margin-left:3px}
.fire{font-size:12px;color:var(--pink);margin-left:6px;font-weight:800}
.pts{font-weight:800;color:var(--hd)}

.devwarn{display:block;background:#fff0f5;border:2px solid var(--pink);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.devwarn b{display:block;font-size:15px;color:var(--pink)}
[data-theme=dark] .devwarn{background:#3a0020}
[data-theme=dark] .devwarn b{color:#ff5c93}

.giveup{font-size:13px;font-weight:700;color:var(--mute);border:2px solid var(--line);border-radius:999px;padding:8px 16px;background:transparent}
.giveup.confirm{color:#fff;background:var(--pink);border-color:var(--pink)}
.giveup:disabled{opacity:.5}
.proud{text-align:center}
.proud .shirt{width:150px;height:150px;margin:4px auto 10px;display:block;filter:drop-shadow(0 10px 18px rgba(55,0,60,.35))}
.proud .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
.proud h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px;color:var(--hd)}
.proud p{font-size:16px;margin:0 0 4px}
.proud .pts{font-size:42px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;margin:6px 0 10px}
.ballrain{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.ballrain span{position:absolute;top:-60px;animation:ballfall linear forwards}
@keyframes ballfall{to{transform:translate(var(--drift),110vh) rotate(var(--spin))}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:71}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.modal .box.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
/* telefoon */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,input,a,.tile{touch-action:manipulation}
.top{padding-top:calc(18px + env(safe-area-inset-top))}
.top .inner{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
.wrap{padding-bottom:calc(80px + env(safe-area-inset-bottom));padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
.toast{bottom:calc(24px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px);text-align:center}
.modal{padding:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom))}
.modal .box{max-height:90vh;max-height:90dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sugg button{min-height:52px}
.btn{min-height:44px}
.row .btn{flex:1 1 auto}
.copyarea{font-size:16px}
@media (max-width:360px){
  .wrap{padding-left:10px;padding-right:10px}
  .colhead,.tiles{gap:4px}
  .tile{height:46px;font-size:12.5px;border-radius:8px}
  .tile .club{font-size:12px}
  .tile .ar{font-size:10px}
  .brand .t1{font-size:21px}
  .brand .t2{font-size:11.5px}
  .mascot{width:92px;height:92px;margin:-16px -10px -16px -4px}
  .helpbtn{width:32px;height:32px}
  nav button{font-size:13px}
  .seg button{padding:7px 10px;font-size:12px}
  .stats b{font-size:17px}
  .result .big{font-size:38px}
  .proud h2{font-size:25px}
  .bigcode{font-size:26px;letter-spacing:.12em}
  .colhead{font-size:9.5px}
}
.linkbtn{text-decoration:underline;color:var(--link);font-weight:700}
.winner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(4,245,255,.18),rgba(0,255,133,.18));border:2px solid var(--green);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.winner .cup{font-size:30px;line-height:1}
.winner b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hd)}
.winner span{font-weight:800;font-size:15px}
.cups{font-size:12px;font-weight:800;margin-left:6px;white-space:nowrap}
td.pos.medal{font-size:18px}

/* poules */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:13px;color:var(--mute);flex:none}
.chips button.on{border-color:var(--hd);color:var(--hd)}
.leaguebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.leaguebar .btn{padding:10px 14px}
.lbl2{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.code{font-size:22px;font-weight:800;letter-spacing:.12em;color:var(--hd)}
.bigcode{font-size:34px;font-weight:800;letter-spacing:.18em;text-align:center;padding:14px;border-radius:14px;background:var(--bg);color:var(--hd)}

/* profile */
.field{display:flex;gap:8px}
.field input{flex:1;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:11px 16px;font-size:16px;font-weight:600;outline:none;min-width:0}
.field input:focus{border-color:var(--hd)}
.howto p{font-size:14px;line-height:1.55;margin-bottom:8px;color:var(--body)}
.howto ul{padding-left:18px;font-size:14px;line-height:1.65;color:var(--body)}
.chip{padding:1px 7px;border-radius:5px;color:#37003c}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,0,34,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal .box{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(30,0,34,.4)}
.modal h2{font-size:21px;font-weight:800;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--purple);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 10px 24px rgba(55,0,60,.35)}
.hide{display:none!important}
.copyarea{width:100%;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:13px/1.4 ui-monospace,monospace;height:110px}
@media (max-width:380px){.tile{height:50px;font-size:13.5px}.brand .t1{font-size:22px}}
</style>
</head>
<body>
<div class="top"><div class="inner">
  <header>
    <div class="brand">
      <div class="t1">Differentia<span>le</span></div>
      <div class="t2" id="sub">&nbsp;</div>
    </div>

}

function tileFor(p, fb, k){
  const c = fb[k], arrow = c.d>0 ? "▲" : c.d<0 ? "▼" : "";
  if(k==="team"){ const s=teamS(p.team); return el("div",{class:"tile "+c.c}, el("span",{class:"club"},s), el("i",{class:"stripe",style:"background:"+(COLORS[s]||"#888")})); }
  const main = k==="pos" ? POS[p.pos] : k==="price" ? (p.price/10).toFixed(1) : k==="own" ? fmtOwn(p.own) : p[k];
  return el("div",{class:"tile "+c.c}, el("span",{class:"num"},main), arrow && el("span",{class:"ar"},arrow));
}

// Wat je weet: afgeleid uit de gekleurde vakjes (zonder het antwoord te kennen)
function knowledge(rows){
  const out = [];
  const tHit = rows.find(r=>r.fb.team.c==="exact");
  const notT = [...new Set(rows.filter(r=>r.fb.team.c!=="exact").map(r=>teamS(r.team)))];
  out.push(["Club", tHit ? teamN(tHit.team) : (notT.length ? "niet "+notT.join(", ") : "?")]);
  const pHit = rows.find(r=>r.fb.pos.c==="exact");
  const notP = [...new Set(rows.filter(r=>r.fb.pos.c!=="exact").map(r=>POS[r.pos]))];
  out.push(["Positie", pHit ? POS[pHit.pos] : (notP.length ? "niet "+notP.join(", ") : "?")]);
  const range = (k, fmt) => {
    let lo=-Infinity, hi=Infinity, loIn=false, hiIn=false;
    const setLo=(v,inc)=>{ if(v>lo || (v===lo && !inc)){ lo=v; loIn=inc; } }, setHi=(v,inc)=>{ if(v<hi || (v===hi && !inc)){ hi=v; hiIn=inc; } };
    for(const r of rows){ const f=r.fb[k], v=+r[k], t=TOL[k];
      if(f.c==="exact") return fmt(v);
      if(f.d>0){ if(f.c==="close"){ setLo(v,false); setHi(v+t,true); } else setLo(v+t,false); }
      else { if(f.c==="close"){ setHi(v,false); setLo(v-t,true); } else setHi(v-t,false); }
    }
    if(lo===-Infinity && hi===Infinity) return "?";
    if(lo===-Infinity) return (hiIn?"≤ ":"< ")+fmt(hi);
    if(hi===Infinity) return (loIn?"≥ ":"> ")+fmt(lo);
    return fmt(lo)+" – "+fmt(hi);
  };
  out.push(["Prijs", range("price", v=>fmtPrice(Math.max(0,v)))]);
  out.push(["Eigendom", range("own", v=>Math.max(0,+v.toFixed(1))+"%")]);
  out.push(["Seizoenspunten", range("pts", v=>String(v))]);
  out.push(["GW"+DATA.gw+"-punten", range("gw", v=>String(v))]);
  return out;
}

function leagueText(v){
  const L = v.league || {}, nm = L.name || "Snoep PL", tail = L.gw ? " (teams van GW"+L.gw+")" : "";
  if(!v.hint) return "";
  if(!v.hint.yes) return "Nee: hij zit in geen enkel team van "+nm+tail+".";
  if(v.hint.count==null) return "Ja: hij zit in een team van "+nm+tail+".";
  return "Hij zit in "+v.hint.count+" van de "+(L.total||"?")+" teams van "+nm+tail+".";
}

function searchBox(v){
  const inp = el("input",{placeholder:"Zoek een speler…", autocomplete:"off", autocapitalize:"off", spellcheck:"false", value:S.q, disabled:S.busy});
  const sugg = el("div",{class:"sugg hide"});
  const guessed = new Set(v.rows.map(r=>r.code));
  const draw = () => {
    const q = norm(inp.value.trim()); S.q = inp.value; sugg.innerHTML="";
    if(!q){ sugg.classList.add("hide"); return; }
    const res = LIST.filter(p=>!guessed.has(p.code) && (p.key.includes(q) || p.key.split(/[\s-]/).some(w=>w.startsWith(q)))).slice(0,8);
    if(!res.length) sugg.append(el("div",{class:"note",style:"padding:12px"},"Geen speler gevonden"));
    S.hi = Math.min(S.hi, Math.max(0,res.length-1));
    res.forEach((p,i)=>sugg.append(el("button",{class:i===S.hi?"hi":"", onmousedown:e=>e.preventDefault(), onclick:()=>makeGuess(p.code)},
      el("span",{class:"nm"}, p.web, p.web!==p.full ? el("small",{},p.full) : null),
      el("span",{class:"meta num"}, teamS(p.team)+" · "+POS[p.pos]+" · "+fmtPrice(p.price)))));
    sugg.classList.remove("hide"); sugg._res = res;
  };
  inp.addEventListener("input",()=>{ S.hi=0; draw(); });
  inp.addEventListener("keydown",e=>{
    const res = sugg._res||[];
    if(e.key==="ArrowDown"){ S.hi=Math.min(res.length-1,S.hi+1); draw(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ S.hi=Math.max(0,S.hi-1); draw(); e.preventDefault(); }
    else if(e.key==="Enter" && res[S.hi]) makeGuess(res[S.hi].code);
    else if(e.key==="Escape") sugg.classList.add("hide");
  });
  inp.addEventListener("blur",()=>setTimeout(()=>sugg.classList.add("hide"),300));
  inp.addEventListener("focus",()=>{ if(inp.value) draw(); });
  const box = el("div",{class:"searchbox"}, inp, sugg);
  box.insertAdjacentHTML("afterbegin",'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>');
  if(S.q) setTimeout(draw,0);
  return box;
}

function shareText(v){
  const n = v.rows.length, st = (v.stats && v.stats.streak) || 0;
  const datum = new Date().toLocaleDateString("nl-NL",{timeZone:TZ,weekday:"short",day:"numeric",month:"short"});

  const head = "⚽️ "+datum+" ⚽️\nDifferentiale #"+(dayIndex(S.today)+1)+(v.hints?" "+"💡".repeat(v.hints):"");

const CHEERS = ["Topper!","Sterk!","Netjes!","Goed zo!","Op het nippertje!","Pfoe, net!"];
async function makeGuess(code){
  if(S.busy) return;
  if(S.mode==="practice"){
    const g = S.practice; if(g.guesses.includes(code) || view().done) return;
    g.guesses.push(code); S.q=""; S.hi=0;
    const v = view(); if(v.done){ if(v.won) setTimeout(()=>celebrate(view()), 2100); else setTimeout(()=>toast("Helaas: het was "+P[g.answer].web), 2100); }
    render(); if(!v.done){ const i=document.querySelector(".searchbox input"); if(i) i.focus(); }
    return;
  }
  if(!S.id){ askName(); return; }
  if(!S.srv || S.srv.done) return;
  S.busy = true; S.q = ""; S.hi = 0; render();
  try{
    if(dayStr()!==S.today){ await refresh(); toast("Er is een nieuwe puzzel!"); return; }
    const r = await rpc("av_guess", {...auth(), p_code:code});
    S.srv = {...S.srv, ...r}; S.err = null;
    if(r.done){ if(r.won) setTimeout(()=>celebrate(S.srv), 2100); else setTimeout(()=>toast("Helaas: het was "+r.answer.web), 2100); loadBoard(); }
  }catch(e){ toast("Je gok kwam niet aan. Check je verbinding en probeer opnieuw."); }
  S.busy = false; render();
  if(S.srv && !S.srv.done){ const i=document.querySelector(".searchbox input"); if(i) i.focus(); }
}
async function useHint(){
  if(S.mode==="practice"){ S.practice.hints++; render(); return; }
  S.busy = true; render();
  try{ const r = await rpc("av_hint", auth()); S.srv = {...S.srv, ...r}; }
  catch(e){ toast("De hint kwam niet aan. Probeer het opnieuw."); }
  S.busy = false; render();
}
async function giveUp(){
  if(S.mode==="practice"){ S.practice.gaveUp = true; toast("Het was "+P[S.practice.answer].web); render(); return; }
  if(!S.id || !S.srv || S.srv.done) return;
  S.busy = true; render();
  try{ const r = await rpc("av_giveup", auth()); S.srv = {...S.srv, ...r}; if(r.answer) toast("Het was "+r.answer.web); loadBoard(); }
  catch(e){ toast("Opgeven lukte niet. Check je verbinding en probeer opnieuw."); }
  S.busy = false; render();
}
function startPractice(){
  const pool = LIST.slice(0,240), today = S.srv && S.srv.answer ? S.srv.answer.code : null;
  let c; do { c = pool[Math.floor(Math.random()*pool.length)].code; } while(c===today);
  S.practice = {answer:c, guesses:[], hints:0, gaveUp:false}; S.confirmGiveUp = false; S.mode = "practice"; S.tab="play"; S.q=""; render();
}

  </svg>`;
}
function ballRain(n){
  const box = el("div",{class:"ballrain"});
  for(let i=0;i<n;i++){ const b=el("span",{},"⚽"); const size=18+Math.random()*26, dur=1.8+Math.random()*1.6, delay=Math.random()*1.2;
    b.style.cssText=`left:${Math.random()*100}vw;font-size:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;--spin:${(Math.random()<.5?-1:1)*(360+Math.random()*540)}deg;--drift:${(Math.random()-.5)*80}px`;
    box.append(b); }
  document.body.append(box); setTimeout(()=>box.remove(),5200);
}
function confetti(){
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const ctx=c.getContext("2d"), dpr=window.devicePixelRatio||1, W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr;
  const cols=["#37003c","#00ff85","#04f5ff","#e90052","#ffd23f","#ffffff"];
  const Q=Array.from({length:180},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14*dpr,vy:(-Math.random()*16-6)*dpr,s:(5+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(now){ const t=now-t0; ctx.clearRect(0,0,W,H);
    for(const p of Q){ p.vy+=.45*dpr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-t/3500); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    if(t<3500) requestAnimationFrame(f); else c.remove(); })(t0);
}
function celebrate(v){
  const a = v.answer, n = v.rows.length, first = n===1;
  const full = (P[a.code] && P[a.code].full) || a.web;
  const box = el("div",{class:"proud"});
  box.insertAdjacentHTML("beforeend", shirtSVG(a));
  box.append(el("div",{class:"eyebrow"}, first ? "In één keer!" : "Geraden in "+n+"/6"),
    el("h2",{}, first ? "Wat een kenner." : n<=3 ? "Goed geraden!" : n<6 ? "Netjes!" : "Op het nippertje!"),
    el("p",{}, "Het was ", el("b",{}, full), " (" + teamN(a.team) + ")."),
    el("div",{class:"pts num"}, (v.practice ? "Oefenronde" : "+"+v.points+" ptn")),
    el("div",{class:"row"}, !v.practice ? el("button",{class:"btn",onclick:()=>copyShare(v)},"📤 Deel resultaat") : null, el("button",{class:"btn ghost",onclick:closeModal},"Dank je")));
  openModal(box, false);
  const bx = document.querySelector(".modal .box"); if(bx) bx.classList.add("pop");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  ballRain(first ? 40 : 26);
  if(first) confetti();
}

/* ---------- poules ---------- */
const leagueName = code => ((S.leagues.find(l=>l.code===code))||{}).name || ("Poule "+code);
const INVITE_BASE = location.origin + location.pathname;
async function createLeague(name){
  name = name.trim().slice(0,30);
  if(!name){ toast("Geef je poule een naam"); return; }
  if(!S.id){ askName(); return; }
  try{ const code = await rpc("av_create_league", {...auth(), p_name:name}); await refresh(); S.scope = code; S.tab = "board"; render(); loadBoard(); showInvite(code); }
  catch(e){ toast(errText(e)); }
}
async function joinLeague(raw){
  const code = String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==6){ toast("Een poulecode heeft 6 tekens"); return; }
  if(!S.id){ askName(); return; }
  try{ const name = await rpc("av_join_league", {...auth(), p_code:code}); await refresh(); S.scope = code; S.tab = "board"; render(); loadBoard(); toast("Je zit nu in "+name); }
  catch(e){ toast(errText(e)); }
}
function leaveLeague(code){
  openModal(el("div",{}, el("h2",{text:"Poule verlaten?"}),
    el("p",{class:"note",style:"margin-bottom:14px"},"Je verdwijnt uit de stand van "+leagueName(code)+". Je punten blijven bewaard en met de code kun je altijd terugkomen."),
    el("div",{class:"row"}, el("button",{class:"btn",onclick:async()=>{ closeModal(); try{ await rpc("av_leave_league", {...auth(), p_code:code}); await refresh(); S.scope="all"; render(); loadBoard(); toast("Poule verlaten"); }catch(e){ toast(errText(e)); } }},"Verlaten"),
      el("button",{class:"btn ghost",onclick:closeModal},"Blijven"))), false);
}
function inviteText(code){ return "Doe mee met mijn poule “"+leagueName(code)+"” in Differentiale, de dagelijkse FPL-puzzel! Poulecode: "+code+"\n"+INVITE_BASE+"#poule-"+code; }
function showInvite(code){
  openModal(el("div",{}, el("h2",{text:"Nodig je vrienden uit"}),
    el("p",{class:"note",style:"margin-bottom:12px"},"Stuur de link of de code naar je vrienden. Zodra ze meedoen, zien jullie samen de stand van "+leagueName(code)+"."),
    el("div",{class:"bigcode num"}, code),
    el("div",{class:"row",style:"margin-top:14px"}, el("button",{class:"btn",onclick:()=>copyText(inviteText(code))},"Kopieer uitnodiging"))));
}
async function handlePendingJoin(){
  if(!S.pendingJoin || !S.id || !S.me) return;
  const code = S.pendingJoin; S.pendingJoin = null;
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(S.leagues.some(l=>l.code===code)){ S.scope=code; S.tab="board"; render(); loadBoard(); return; }
  let name = null; try{ name = await rpc("av_league_name", {p_code:code}); }catch(e){}
  if(!name){ toast("Poule "+code+" niet gevonden"); return; }
  openModal(el("div",{}, el("h2",{text:"Je bent uitgenodigd!"}),
    el("p",{class:"note",style:"margin-bottom:14px"},"Doe mee met poule “"+name+"” en vergelijk elke dag je score met je vrienden."),
    el("div",{class:"row"}, el("button",{class:"btn",onclick:()=>{ closeModal(); joinLeague(code); }},"Doe mee"), el("button",{class:"btn ghost",onclick:closeModal},"Nee, bedankt"))), false);
}

/* ---------- klassement ---------- */
async function loadBoard(){
  if(!API || !S.id) return;
  const scope = S.scope;
  S.boardLoading = true;
  try{
    const r = await rpc("av_board", {...auth(), p_scope: scope==="all" ? "ALL" : scope});
    if(scope===S.scope){ S.rows = r || []; S.boardErr = null; }
  }catch(e){ if(/niet in deze poule/.test(errText(e))){ S.scope="all"; } S.boardErr = "Het klassement kan nu niet worden geladen."; }
  S.boardLoading = false;
  if(S.tab==="board") render();
}
function renderBoard(){
  const box = el("div");
  if(S.scope!=="all" && !S.leagues.some(l=>l.code===S.scope)) S.scope = "all";
  const pick = s => { if(S.scope!==s){ S.scope=s; S.rows=null; render(); loadBoard(); } };
  box.append(el("div",{class:"chips"},
    el("button",{class:S.scope==="all"?"on":"", onclick:()=>pick("all")},"Iedereen"),
    S.leagues.map(l=>el("button",{class:S.scope===l.code?"on":"", onclick:()=>pick(l.code)}, l.name))));
  box.append(el("div",{style:"text-align:center"}, el("div",{class:"seg"}, [["today","Vandaag"],["week","Deze week"],["season","Seizoen"]].map(([k,t])=>el("button",{class:S.board===k?"on":"",onclick:()=>{S.board=k;render();}},t)))));
  const panel = el("div",{class:"panel",style:"padding:6px 8px"});
  if(!API || !S.id){ panel.append(el("p",{class:"note",style:"padding:10px"}, !API ? "Het klassement is nog niet gekoppeld." : "Kies eerst een managernaam.")); box.append(panel); return box; }
  if(!S.rows){ panel.append(el("p",{class:"note",style:"padding:10px"}, S.boardErr || "Klassement laden…")); box.append(panel); if(!S.boardLoading) loadBoard(); return box; }

  // weekwinnaar van vorige week
  const lw = Math.max(0, ...S.rows.map(r=>r.last_week_points||0));
  if(lw>0){
    const winners = S.rows.filter(r=>r.last_week_points===lw).map(r=>r.name);
    box.insertBefore(el("div",{class:"winner"}, el("span",{class:"cup"},"🏆"), el("div",{}, el("b",{},"Weekwinnaar vorige week"), el("span",{}, winners.join(" & ")+" · "+lw+" ptn"))), box.children[1]);
  }
  const key = S.board==="today" ? "today_points" : S.board==="week" ? "week_points" : "season_points";
  const myDone = !!(S.srv && S.srv.done);
  let rows = S.rows.slice();
  if(S.board==="today") rows = rows.filter(r=>r.today_played || r.is_me);
  rows.sort((a,b)=>(b[key]??-1)-(a[key]??-1) || b.streak-a.streak || String(a.name).localeCompare(String(b.name)));
  let pos=0; rows.forEach((r,i)=>{ if(i===0 || (r[key]??-1)!==(rows[i-1][key]??-1) || r.streak!==rows[i-1].streak) pos=i+1; r.pos=pos; });
  if(!rows.length){ panel.append(el("p",{class:"note",style:"padding:12px"}, S.board==="today" ? "Nog niemand heeft vandaag gespeeld. Wees de eerste!" : "Nog geen scores.")); }
  else {
    const t = el("table",{}, el("thead",{}, el("tr",{}, el("th",{},"#"), el("th",{},"Manager"), S.board==="today"?el("th",{class:"r"},"Gok"):null, el("th",{class:"r"},"Ptn"))));
    const tb = el("tbody");
    rows.forEach(r=>{
      const val = r[key], medal = val>0 && r.pos<=3 ? ["🥇","🥈","🥉"][r.pos-1] : null;
      const nameCell = el("td",{}, el("span",{},String(r.name)), el("span",{class:"tag"},"#"+(r.tag||"")),
        r.cups>0 ? el("span",{class:"cups",title:r.cups+" keer weekwinnaar"},"🏆"+(r.cups>1?r.cups:"")) : null,
        r.streak>=2 ? el("span",{class:"fire"},"🔥"+r.streak) : null);
      const gok = S.board==="today" ? el("td",{class:"r num",style:"color:var(--mute)"}, r.today_n!=null ? (r.today_gave_up ? "🏳️" : r.today_won ? r.today_n+"/6" : "X/6") : (r.today_played ? "✓" : "–")) : null;
      tb.append(el("tr",{class:r.is_me?"me":""}, el("td",{class:"pos num"+(medal?" medal":"")}, medal || String(r.pos)), nameCell, gok,
        el("td",{class:"r pts num"}, val==null ? (S.board==="today" && !r.today_played ? "–" : "?") : String(val))));
    });
    t.append(tb); panel.append(t);
  }
  box.append(panel);
  if(S.scope!=="all") box.append(el("div",{class:"panel leaguebar"},
    el("div",{}, el("div",{class:"lbl2"},"Poulecode"), el("div",{class:"code num"},S.scope)),
    el("div",{class:"row",style:"justify-content:flex-end"}, el("button",{class:"btn",onclick:()=>showInvite(S.scope)},"Nodig uit"), el("button",{class:"btn ghost",onclick:()=>leaveLeague(S.scope)},"Verlaat"))));
  if(S.board==="today" && !myDone) box.append(el("p",{class:"note",style:"text-align:center"},"De uitslagen van vandaag zie je zodra je zelf klaar bent."));
  box.append(el("p",{class:"note",style:"text-align:center;margin-top:8px"},"Week = maandag t/m zondag. Wie een week de meeste punten haalt, wint een weekbeker 🏆; gelijk = allebei. Gelijke stand? De langste reeks 🔥 staat hoger."));

  const nameIn = el("input",{placeholder:"Naam, bijv. Snoep PL", maxlength:30});
  const codeIn = el("input",{placeholder:"Code, bijv. K7P2QX", maxlength:6, autocapitalize:"characters"});
  const mk = () => createLeague(nameIn.value), jn = () => joinLeague(codeIn.value);
  nameIn.addEventListener("keydown",e=>{ if(e.key==="Enter") mk(); });
  codeIn.addEventListener("keydown",e=>{ if(e.key==="Enter") jn(); });
  box.append(el("div",{class:"panel",style:"margin-top:14px"}, el("h3",{},"Poules"),
    el("p",{class:"note",style:"margin-bottom:12px"},"Maak een poule en deel de code met je vrienden. Dan zien jullie de onderlinge stand per dag, week en seizoen, met weekbekers."),
    el("div",{class:"lbl2"},"Nieuwe poule"),
    el("div",{class:"field",style:"margin-bottom:12px"}, nameIn, el("button",{class:"btn",onclick:mk},"Maak aan")),
    el("div",{class:"lbl2"},"Doe mee met een poule"),
    el("div",{class:"field"}, codeIn, el("button",{class:"btn ghost",onclick:jn},"Doe mee"))));
  return box;
}

/* ---------- profiel-tab ---------- */
function renderMe(){
  const box = el("div");
  const s = (S.srv && S.srv.stats) || {played:0,won:0,streak:0,best:0};
  const pct = s.played ? Math.round(100*s.won/s.played) : 0;
  box.append(el("div",{class:"panel"}, el("h3",{},"Jouw statistieken"),
    el("div",{class:"stats",style:"margin:0"}, [["Gespeeld",s.played],["Gewonnen",pct+"%"],["Reeks",s.streak],["Beste",s.best]].map(([t,val])=>el("div",{style:"text-align:center"},el("b",{class:"num"},String(val)),el("span",{},t))))));
  if(S.me){
    const inp = el("input",{value:S.me.name||"", maxlength:24, placeholder:"Managernaam"});
    const save = () => rename(inp.value);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") save(); });
    box.append(el("div",{class:"panel"}, el("h3",{},"Managernaam"), el("div",{class:"field"}, inp, el("button",{class:"btn",onclick:save},"Opslaan")),
      el("p",{class:"note",style:"margin-top:8px"},"Je nummer #"+S.me.tag+" blijft hetzelfde.")));
    box.append(el("div",{class:"panel"}, el("h3",{},"Herstelcode"),
      el("p",{class:"note",style:"margin-bottom:10px"},"Nieuwe telefoon of browser? Met deze code haal je je profiel, punten en poules terug. Bewaar hem goed, bijvoorbeeld in je notities, en deel hem met niemand."),
      el("div",{class:"bigcode num",style:"font-size:24px"}, fmtRec(S.me.recovery)),
      el("div",{class:"row",style:"margin-top:12px"}, el("button",{class:"btn",onclick:()=>copyText("Mijn herstelcode voor Differentiale: "+fmtRec(S.me.recovery))},"Kopieer herstelcode"))));
  } else if(API){
    box.append(el("div",{class:"panel"}, el("h3",{},"Profiel"), el("div",{class:"row"}, el("button",{class:"btn",onclick:askName},"Kies een managernaam"), el("button",{class:"btn ghost",onclick:askRestore},"Profiel herstellen"))));
  }
  if(S.me) box.append(el("p",{class:"note",style:"text-align:center;margin-bottom:12px"}, "Ander profiel terugzetten? ", el("button",{class:"linkbtn",onclick:askRestore},"Profiel herstellen met een herstelcode")));
  box.append(el("div",{class:"panel"}, howTo()));
  box.append(el("div",{class:"row",style:"margin:6px 0 14px"}, el("button",{class:"btn ghost",onclick:startPractice},"Speel een oefenronde")));
  box.append(el("div",{class:"panel"}, el("h3",{},"Op je beginscherm"), el("p",{class:"note"},"Zet Differentiale als app op je telefoon. iPhone: open de site in Safari, tik op de deel-knop en kies ‘Zet op beginscherm’. Android: open het menu in Chrome en kies ‘App installeren’.")));
  box.append(el("p",{class:"note",style:"text-align:center"},"Speldata: FPL na GW"+DATA.gw+" (bijgewerkt "+String(DATA.updated).slice(0,10)+")."));
  return box;
}

/* ---------- boot ---------- */
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{ S.tab=b.dataset.tab; render(); if(S.tab==="board") loadBoard(); }));
window.addEventListener("hashchange",()=>{ const m = location.hash.match(/^#poule-([A-Za-z0-9]{6})$/); if(m){ S.pendingJoin = m[1].toUpperCase(); handlePendingJoin(); } });
$("#helpBtn").addEventListener("click",()=>openModal(howTo()));
function syncThemeLbl(){ $("#themeLbl").textContent = document.documentElement.dataset.theme==="dark" ? "dag" : "nacht"; }
$("#themeBtn").addEventListener("click",()=>{ const t = document.documentElement.dataset.theme==="dark" ? "light" : "dark"; document.documentElement.dataset.theme=t; try{ localStorage.setItem("avdd:theme",t); }catch(e){} syncThemeLbl(); });
syncThemeLbl();
setInterval(()=>{ if(dayStr()!==S.today){ S.today=dayStr(); S.mode="daily"; S.rows=null; refresh(); } }, 30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && dayStr()!==S.today){ S.today=dayStr(); refresh(); } });
boot();
if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
